<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pace-cast</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>pace-cast</h1>
    <p id="status" class="status disconnected">Desconectado</p>
  </header>

  <main>
    <div id="video-wrapper" class="video-wrapper">
      <video id="video" controls controlsList="nofullscreen" preload="auto"></video>
      <div id="hud" class="hud">
        <span>Cadencia: <strong id="cadence">0</strong> pasos/min</span>
        <span>Velocidad: <strong id="rate">1.00</strong>x</span>
      </div>
    </div>

    <div class="controls">
      <label class="file-picker">
        Elegir video
        <input id="file-input" type="file" accept="video/*" />
      </label>

      <form id="url-form" class="url-form">
        <input id="url-input" type="url" placeholder="https://archive.org/download/.../video.mp4" />
        <button type="submit">Cargar URL</button>
      </form>

      <select id="list-select">
        <option value="" selected disabled>Elegir de la lista</option>
      </select>

      <button id="fullscreen-btn" type="button">Pantalla completa</button>
    </div>
  </main>

  <script src="videos.js"></script>
  <script src="app.js"></script>
</body>
</html>
